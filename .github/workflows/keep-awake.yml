name: keep-awake

# Render's free plan puts a service to sleep after 15 minutes without visits, and the
# first visit after that waits for it to start again. This opens the live demos every
# 10 minutes from 9:00 to 20:00 in São Paulo (12:00-22:59 UTC), when people are more
# likely to look at them. Not all day: the free plan has 750 hours a month for all the
# services together, and two of them awake 24/7 would go over that.
on:
  schedule:
    - cron: "*/10 12-22 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Open the demos
        run: |
          for url in \
            https://booking-system-j7po.onrender.com/api/business \
            https://trail-sfqz.onrender.com/health; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 --retry 2 "$url" || true)
            echo "$url $code"
          done
